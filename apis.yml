aid: mitiga
name: Mitiga
description: >-
  Mitiga is a cloud and SaaS security company built around what it calls Zero-Impact Breach
  Prevention — an AI-native Cloud Detection and Response (CDR) platform that ingests,
  normalizes and retains activity logs from roughly 100 cloud, SaaS, identity and AI
  platforms in a Cloud Security Data Lake with 1,000+ days of forensic retention, then
  detects, investigates and helps contain active attacks. The company was founded by cloud
  incident responders and sells 24/7 managed cloud detection and response, managed threat
  hunting, and emergency cloud and SaaS incident response alongside the platform, with
  Helios AI as its AI SOC analyst layer. Monitoring is agentless and API-based: Mitiga is a
  heavy consumer of other providers' APIs rather than a publisher of a public developer
  program. Its own product API runs at api.mitiga.cloud behind a Kong gateway and an Auth0
  OAuth 2.0 authorization server, but no public reference or machine-readable contract is
  published.
