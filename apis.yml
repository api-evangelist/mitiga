apis:
- aid: mitiga:mitiga-platform-api
  name: Mitiga Platform API
  description: >-
    The product API behind the Mitiga cloud detection and response platform. The host is
    live and fronted by a Kong gateway, and it publishes an anonymous RFC 8414
    authorization-server metadata document, so the OAuth 2.0 / OpenID Connect surface is
    verifiable from the outside. Every product route returns "no Route matched with those
    values" to an unauthenticated caller, and Mitiga publishes no reference, no OpenAPI and
    no developer portal — the contract is reachable only inside a customer tenant.
  humanURL: https://www.mitiga.io/platform
  baseURL: https://api.mitiga.cloud
  tags:
  - Cloud Detection and Response
  - Security
  - Incident Response
